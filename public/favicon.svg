<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- PMFlow logo: flowchart-style icon with navy + amber -->
  <rect width="64" height="64" rx="12" fill="#2d478c"/>
  <!-- Top node -->
  <rect x="22" y="8" width="20" height="12" rx="3" fill="white"/>
  <!-- Middle node -->
  <rect x="22" y="28" width="20" height="12" rx="3" fill="#f59e0b"/>
  <!-- Bottom left node -->
  <rect x="8" y="48" width="16" height="10" rx="2" fill="white" opacity="0.8"/>
  <!-- Bottom right node -->
  <rect x="40" y="48" width="16" height="10" rx="2" fill="white" opacity="0.8"/>
  <!-- Connector: top to middle -->
  <line x1="32" y1="20" x2="32" y2="28" stroke="white" stroke-width="2"/>
  <!-- Connector: middle to bottom-left -->
  <line x1="24" y1="40" x2="16" y2="48" stroke="white" stroke-width="2"/>
  <!-- Connector: middle to bottom-right -->
  <line x1="40" y1="40" x2="48" y2="48" stroke="white" stroke-width="2"/>
  <!-- Arrow heads -->
  <polygon points="32,28 30,23 34,23" fill="white"/>
  <polygon points="16,48 14,43 18,43" fill="white"/>
  <polygon points="48,48 46,43 50,43" fill="white"/>
</svg>
